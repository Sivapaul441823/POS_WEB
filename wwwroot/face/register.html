<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Face Registration</title>

    <link rel="stylesheet"
          href="register.css">
</head>

<body>

    <div class="face-container">

        <h1>Register Face</h1>

        <video id="camera"
               autoplay
               playsinline>
        </video>

        <button id="captureBtn">
            Capture Face
        </button>

        <canvas id="canvas"
                style="display:none;">
        </canvas>

        <p id="message"></p>

    </div>

    <script src="register.js"></script>

</body>

</html>
